<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notifai — get emailed when it happens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e8eaf0;
      --muted: #7b7f94;
      --accent: #6c8ef7;
      --accent-hover: #8aa3ff;
      --green: #4ade80;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .logo span { color: var(--accent); }

    .tagline {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .examples {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .examples-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .example {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .example::before {
      content: "→ ";
      color: var(--accent);
    }

    .form-section {
      margin-top: 2rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="email"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.875rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="email"]:focus {
      border-color: var(--accent);
    }

    input[type="email"]::placeholder { color: var(--muted); }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: default; }

    .success {
      display: none;
      margin-top: 1rem;
      background: rgba(74, 222, 128, 0.08);
      border: 1px solid rgba(74, 222, 128, 0.25);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: var(--green);
    }

    .error {
      display: none;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #f87171;
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">notif<span>ai</span></div>
    <p class="tagline">Type a condition. Get emailed when it's true.</p>

    <div class="examples">
      <div class="examples-label">Notify me when…</div>
      <div id="examples"></div>
    </div>

    <div class="form-section">
      <label class="form-label" for="email">Enter your email to get started</label>
      <form id="form">
        <div class="input-row">
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          <button type="submit" id="btn">Sign in</button>
        </div>
      </form>
      <div class="success" id="success">Check your email — we sent you a sign-in link.</div>
      <div class="error" id="error"></div>
    </div>
  </div>

  <p class="footer">Checks run daily. No noise — only emails when your condition is met. &nbsp;·&nbsp; <a href="https://github.com/david-martin/notifai" style="color:var(--muted);text-decoration:underline" target="_blank" rel="noopener">Open source</a></p>

  <script src="/examples.js"></script>
  <script src="/index.js"></script>
</body>
</html>
